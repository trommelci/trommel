lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    zod:
      specifier: ^3.24.0
      version: 3.24.3

overrides:
  tinyspy: 3.0.0

importers:

  .:
    dependencies:
      '@vitest/coverage-v8':
        specifier: 5.0.1
        version: 5.0.1(vitest@5.0.1)
      ai:
        specifier: 6.0.5
        version: 6.0.5(zod@4.6.7)
      zod3:
        specifier: npm:zod@3.24.3
        version: zod@3.24.3
      zod443:
        specifier: https://registry.npmjs.org/zod/-/zod-4.4.3.tgz
        version: https://registry.npmjs.org/zod/-/zod-4.4.3.tgz
    devDependencies:
      vitest:
        specifier: 5.0.1
        version: 5.0.1

  packages/@scope/b:
    dependencies:
      vitest:
        specifier: 5.0.1
        version: 5.0.1

  packages/a:
    dependencies:
      '@scope/b':
        specifier: workspace:*
        version: link:../@scope/b
    optionalDependencies:
      '@esbuild/darwin-arm64':
        specifier: 0.27.7
        version: 0.27.7

packages:

  '@esbuild/darwin-arm64@0.27.7':
    resolution: {integrity: sha512-esbuild-darwin-arm64}
    engines: {node: '>=18'}
    cpu: [arm64]
    os: [darwin]
    optional: true

  '@vitest/coverage-v8@5.0.1':
    resolution: {integrity: sha512-coverage-v8}
    peerDependencies:
      vitest: 5.0.1

  ai@6.0.5:
    resolution: {integrity: sha512-ai}
    engines: {node: '>=18'}

  tinyspy@3.0.0:
    resolution: {integrity: sha512-tinyspy}

  vitest@5.0.1:
    resolution: {integrity: sha512-vitest}
    hasBin: true

  zod443@https://registry.npmjs.org/zod/-/zod-4.4.3.tgz:
    resolution: {tarball: https://registry.npmjs.org/zod/-/zod-4.4.3.tgz}
    version: 4.4.3

  zod@3.24.3:
    resolution: {integrity: sha512-zod}

snapshots:

  '@esbuild/darwin-arm64@0.27.7':
    optional: true

  '@vitest/coverage-v8@5.0.1(vitest@5.0.1)':
    dependencies:
      vitest: 5.0.1

  ai@6.0.5(zod@4.6.7):
    dependencies:
      zod: 4.6.7

  tinyspy@3.0.0: {}

  vitest@5.0.1:
    dependencies:
      tinyspy: 3.0.0

  zod443@https://registry.npmjs.org/zod/-/zod-4.4.3.tgz: {}

  zod@3.24.3: {}
